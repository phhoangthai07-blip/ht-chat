<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusChat - Nhắn tin thời gian thực</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-javascript@2"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    .chat-bubble-me { background-color: #2563eb; color: white; border-radius: 16px 16px 4px 16px; }
    .chat-bubble-other { background-color: #374151; color: white; border-radius: 16px 16px 16px 4px; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex overflow-hidden">

  <!-- MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
  <div id="auth-screen" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50 p-4">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-blue-500 flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> NexusChat
        </h1>
        <p class="text-gray-400 text-sm mt-1" id="auth-subtitle">Đăng nhập để kết nối thời gian thực</p>
      </div>

      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
        <div id="display-name-group" class="hidden">
          <label class="block text-sm text-gray-400 mb-1">Tên hiển thị</label>
          <input type="text" id="display-name" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">Email</label>
          <input type="email" id="email" required placeholder="name@example.com" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">Mật khẩu</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
        </div>

        <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-all shadow-lg shadow-blue-500/20">
          Đăng nhập
        </button>
      </form>

      <div class="mt-4 text-center">
        <button onclick="toggleAuthMode()" id="toggle-auth-btn" class="text-blue-400 hover:underline text-sm">
          Chưa có tài khoản? Đăng ký ngay
        </button>
      </div>
    </div>
  </div>

  <!-- GIAO DIỆN CHAT CHÍNH -->
  <div id="app-screen" class="hidden w-full h-full flex">
    <!-- SIDEBAR -->
    <div class="w-80 bg-gray-800 border-r border-gray-700 flex flex-col">
      <div class="p-4 border-b border-gray-700 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-lg" id="my-avatar">U</div>
          <div>
            <h3 class="font-bold text-sm" id="my-name">User</h3>
            <span class="text-xs text-green-400 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-400 inline-block"></span> Online</span>
          </div>
        </div>
        <button onclick="logout()" class="text-gray-400 hover:text-red-400 transition-colors p-2" title="Đăng xuất">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>

      <div class="p-3">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Phòng chat chung (Global)</p>
        <div onclick="selectRoom('global')" class="p-3 bg-blue-600/20 border border-blue-500/30 rounded-xl cursor-pointer flex items-center gap-3 hover:bg-blue-600/30 transition-all">
          <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white"><i class="fa-solid fa-users"></i></div>
          <div>
            <h4 class="font-bold text-sm">Sảnh Chung</h4>
            <p class="text-xs text-gray-400">Trò chuyện với mọi người</p>
          </div>
        </div>
      </div>
    </div>

    <!-- KHUNG CHAT -->
    <div class="flex-1 flex flex-col bg-gray-900">
      <div class="p-4 border-b border-gray-800 bg-gray-800/50 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white"><i class="fa-solid fa-users"></i></div>
          <div>
            <h3 class="font-bold text-sm">Sảnh Chung</h3>
            <span class="text-xs text-green-400">Realtime Chat</span>
          </div>
        </div>
      </div>

      <!-- TIN NHẮN -->
      <div class="flex-1 overflow-y-auto p-4 space-y-4" id="messages-container">
        <div class="text-center text-gray-500 my-auto">Đang tải tin nhắn...</div>
      </div>

      <!-- NHẬP TIN NHẮN -->
      <form id="message-form" onsubmit="handleSendMessage(event)" class="p-4 bg-gray-800 border-t border-gray-700 flex items-center gap-2">
        <input type="text" id="message-input" placeholder="Nhập tin nhắn..." required class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg transition-all">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    // CẤU HÌNH DỰ ÁN SUPABASE CỦA BẠN
    const SUPABASE_URL = "https://bclybeujhhiwevgppgt.supabase.co";
    // MÃ KEY DƯỚI ĐÂY ĐÃ ĐƯỢC ĐIỀN CHÍNH XÁC THEO HÌNH CỦA BẠN:
    const SUPABASE_ANON_KEY = "sb_publishable_yFagLzYinzPyztZkhJb-BQ_6xx_L_M0"; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignUp = false;
    let currentUser = null;

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      document.getElementById('display-name-group').classList.toggle('hidden', !isSignUp);
      document.getElementById('auth-subtitle').innerText = isSignUp ? "Tạo tài khoản mới" : "Đăng nhập để kết nối thời gian thực";
      document.getElementById('auth-submit-btn').innerText = isSignUp ? "Đăng ký" : "Đăng nhập";
      document.getElementById('toggle-auth-btn').innerText = isSignUp ? "Đã có tài khoản? Đăng nhập" : "Chưa có tài khoản? Đăng ký ngay";
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (isSignUp) {
        const displayName = document.getElementById('display-name').value || email.split('@')[0];
        const { data, error } = await supabaseClient.auth.signUp({
          email, password,
          options: { data: { display_name: displayName } }
        });
        if (error) alert("Lỗi đăng ký: " + error.message);
        else {
          alert("Đăng ký thành công! Hãy chuyển sang Đăng nhập.");
          toggleAuthMode();
        }
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) alert("Lỗi đăng nhập: " + error.message);
        else {
          currentUser = data.user;
          initApp();
        }
      }
    }

    function initApp() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      const name = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
      document.getElementById('my-name').innerText = name;
      document.getElementById('my-avatar').innerText = name[0].toUpperCase();

      loadMessages();
      subscribeRealtime();
    }

    async function loadMessages() {
      const container = document.getElementById('messages-container');
      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) {
        container.innerHTML = `<div class="text-center text-red-400">Lỗi tải tin nhắn: ${error.message}</div>`;
        return;
      }

      container.innerHTML = '';
      if (data.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-500 my-auto">Chưa có tin nhắn nào. Hãy mở lời trước nhé!</div>`;
      } else {
        data.forEach(msg => renderMessage(msg));
        scrollToBottom();
      }
    }

    function renderMessage(msg) {
      const container = document.getElementById('messages-container');
      const isMe = currentUser && msg.sender_id === currentUser.id;

      const div = document.createElement('div');
      div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
      
      div.innerHTML = `
        <div class="text-xs text-gray-400 mb-1 px-1">${isMe ? 'Bạn' : (msg.sender_name || 'Thành viên')}</div>
        <div class="${isMe ? 'chat-bubble-me' : 'chat-bubble-other'} px-4 py-2.5 max-w-xs md:max-w-md break-words shadow-md">
          ${msg.text}
        </div>
      `;
      container.appendChild(div);
      scrollToBottom();
    }

    async function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      input.value = '';

      const { error } = await supabaseClient.from('messages').insert([
        { 
          conversation_id: 'global', 
          sender_id: currentUser.id, 
          sender_name: currentUser.user_metadata?.display_name || currentUser.email.split('@')[0],
          text: text 
        }
      ]);

      if (error) alert("Lỗi gửi tin nhắn: " + error.message);
    }

    function subscribeRealtime() {
      supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          renderMessage(payload.new);
        })
        .subscribe();
    }

    function scrollToBottom() {
      const container = document.getElementById('messages-container');
      container.scrollTop = container.scrollHeight;
    }

    function logout() {
      supabaseClient.auth.signOut();
      location.reload();
    }
  </script>
</body>
</html>
