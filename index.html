<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HT Chat</title>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // ==============================
    // SUPABASE
    // ==============================

    const SUPABASE_URL = "https://bclybeujhhiwevgppgt.supabase.co";

    // DÁN PUBLISHABLE KEY CỦA BẠN VÀO ĐÂY
    const SUPABASE_KEY = "sb_publishable_yFagLzYinzPyztZkhJb-BQ_6xx_LRcF";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    // ==============================
    // ELEMENTS
    // ==============================

    const authScreen = document.getElementById("authScreen");
    const chatScreen = document.getElementById("chatScreen");

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");

    const registerUsername = document.getElementById("registerUsername");
    const registerEmail = document.getElementById("registerEmail");
    const registerPassword = document.getElementById("registerPassword");

    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");

    const loginError = document.getElementById("loginError");
    const registerError = document.getElementById("registerError");

    const userList = document.getElementById("userList");
    const messages = document.getElementById("messages");

    const chatName = document.getElementById("chatName");
    const chatStatus = document.getElementById("chatStatus");

    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    const currentUserName = document.getElementById("currentUserName");
    const currentUserAvatar = document.getElementById("currentUserAvatar");

    const logoutButton = document.getElementById("logoutButton");

    let currentUser = null;
    let currentProfile = null;
    let selectedUser = null;
    let realtimeChannel = null;

    // ==============================
    // AUTH SCREEN
    // ==============================

    function showLogin() {
      loginForm.classList.remove("hidden");
      registerForm.classList.add("hidden");

      authTitle.textContent = "Chào mừng trở lại";
      authSubtitle.textContent = "Đăng nhập vào HT Chat";

      loginError.textContent = "";
      registerError.textContent = "";
    }

    function showRegister() {
      loginForm.classList.add("hidden");
      registerForm.classList.remove("hidden");

      authTitle.textContent = "Tạo tài khoản";
      authSubtitle.textContent = "Tham gia HT Chat";

      loginError.textContent = "";
      registerError.textContent = "";
    }

    document.getElementById("showRegister").onclick = () => {
      showRegister();
    };

    document.getElementById("showLogin").onclick = () => {
      showLogin();
    };

    // ==============================
    // LOGIN
    // ==============================

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      loginError.textContent = "";

      const email = loginEmail.value.trim();
      const password = loginPassword.value;

      if (!email || !password) {
        loginError.textContent = "Vui lòng nhập đầy đủ thông tin.";
        return;
      }

      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        loginError.textContent = "Email hoặc mật khẩu không đúng.";
        console.error(error);
      }
    });

    // ==============================
    // REGISTER
    // ==============================

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      registerError.textContent = "";

      const username = registerUsername.value.trim();
      const email = registerEmail.value.trim();
      const password = registerPassword.value;

      if (!username || !email || !password) {
        registerError.textContent = "Vui lòng nhập đầy đủ thông tin.";
        return;
      }

      if (username.length < 3) {
        registerError.textContent = "Tên người dùng phải có ít nhất 3 ký tự.";
        return;
      }

      if (password.length < 6) {
        registerError.textContent = "Mật khẩu phải có ít nhất 6 ký tự.";
        return;
      }

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            username: username
          }
        }
      });

      if (error) {
        registerError.textContent = error.message;
        console.error(error);
        return;
      }

      if (data.session) {
        registerError.textContent = "";
      } else {
        registerError.style.color = "#16a34a";
        registerError.textContent =
          "Tạo tài khoản thành công! Hãy kiểm tra email nếu được yêu cầu xác nhận.";
      }
    });

    // ==============================
    // AUTH STATE
    // ==============================

    supabase.auth.onAuthStateChange(async (event, session) => {
      if (session?.user) {
        currentUser = session.user;

        await loadCurrentProfile();

        authScreen.classList.add("hidden");
        chatScreen.classList.remove("hidden");

        await loadUsers();
      } else {
        currentUser = null;
        currentProfile = null;

        chatScreen.classList.add("hidden");
        authScreen.classList.remove("hidden");

        showLogin();
      }
    });

    // ==============================
    // CURRENT PROFILE
    // ==============================

    async function loadCurrentProfile() {
      if (!currentUser) return;

      const { data, error } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .single();

      if (error) {
        console.error("Profile error:", error);
        return;
      }

      currentProfile = data;

      currentUserName.textContent =
        data.username || currentUser.email.split("@")[0];

      currentUserAvatar.textContent =
        getInitials(data.username || currentUser.email);
    }

    // ==============================
    // LOAD USERS
    // ==============================

    async function loadUsers() {
      const { data, error } = await supabase
        .from("profiles")
        .select("*")
        .neq("id", currentUser.id)
        .order("username");

      if (error) {
        console.error(error);
        return;
      }

      userList.innerHTML = "";

      if (!data || data.length === 0) {
        userList.innerHTML = `
          <div class="empty-users">
            Chưa có người dùng khác.
          </div>
        `;
        return;
      }

      data.forEach(user => {
        const item = document.createElement("button");

        item.className = "user-item";

        item.innerHTML = `
          <div class="avatar">
            ${escapeHtml(getInitials(user.username))}
          </div>

          <div class="user-info">
            <div class="user-name">
              ${escapeHtml(user.username)}
            </div>

            <div class="user-status">
              Nhấn để nhắn tin
            </div>
          </div>
        `;

        item.onclick = () => {
          selectUser(user);
        };

        userList.appendChild(item);
      });
    }

    // ==============================
    // SELECT USER
    // ==============================

    async function selectUser(user) {
      selectedUser = user;

      document.querySelectorAll(".user-item").forEach(item => {
        item.classList.remove("active");
      });

      event?.currentTarget?.classList?.add("active");

      chatName.textContent = user.username;
      chatStatus.textContent = "Đang trò chuyện";

      document.getElementById("chatEmpty").classList.add("hidden");
      document.getElementById("chatContent").classList.remove("hidden");

      await loadMessages();

      subscribeMessages();
    }

    // ==============================
    // LOAD MESSAGES
    // ==============================

    async function loadMessages() {
      if (!currentUser || !selectedUser) return;

      messages.innerHTML = "";

      const { data, error } = await supabase
        .from("messages")
        .select("*")
        .or(
          `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`
        )
        .order("created_at", {
          ascending: true
        });

      if (error) {
        console.error(error);
        return;
      }

      data.forEach(message => {
        renderMessage(message);
      });

      scrollMessages();
    }

    // ==============================
    // REALTIME
    // ==============================

    function subscribeMessages() {
      if (realtimeChannel) {
        supabase.removeChannel(realtimeChannel);
      }

      realtimeChannel = supabase
        .channel("chat-" + currentUser.id)
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages"
          },
          payload => {
            const message = payload.new;

            const belongsToConversation =
              (
                message.sender_id === currentUser.id &&
                message.receiver_id === selectedUser.id
              ) ||
              (
                message.sender_id === selectedUser.id &&
                message.receiver_id === currentUser.id
              );

            if (belongsToConversation) {
              renderMessage(message);
              scrollMessages();
            }
          }
        )
        .subscribe();
    }

    // ==============================
    // SEND MESSAGE
    // ==============================

    async function sendMessage() {
      if (!currentUser || !selectedUser) return;

      const content = messageInput.value.trim();

      if (!content) return;

      sendButton.disabled = true;

      const { error } = await supabase
        .from("messages")
        .insert({
          sender_id: currentUser.id,
          receiver_id: selectedUser.id,
          content: content
        });

      sendButton.disabled = false;

      if (error) {
        console.error(error);
        alert("Không gửi được tin nhắn.");
        return;
      }

      messageInput.value = "";
      messageInput.focus();
    }

    sendButton.onclick = sendMessage;

    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // ==============================
    // RENDER MESSAGE
    // ==============================

    function renderMessage(message) {
      const isMine =
        message.sender_id === currentUser.id;

      const wrapper = document.createElement("div");

      wrapper.className =
        "message-row " + (isMine ? "mine" : "theirs");

      const bubble = document.createElement("div");

      bubble.className = "message-bubble";

      bubble.textContent = message.content;

      wrapper.appendChild(bubble);

      messages.appendChild(wrapper);
    }

    // ==============================
    // LOGOUT
    // ==============================

    logoutButton.onclick = async () => {
      await supabase.auth.signOut();

      if (realtimeChannel) {
        await supabase.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }
    };

    // ==============================
    // HELPERS
    // ==============================

    function getInitials(name) {
      if (!name) return "?";

      return name
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(word => word[0])
        .join("")
        .toUpperCase();
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function scrollMessages() {
      messages.scrollTop = messages.scrollHeight;
    }

    // ==============================
    // MOBILE SIDEBAR
    // ==============================

    document.getElementById("mobileMenu").onclick = () => {
      document
        .getElementById("sidebar")
        .classList.toggle("mobile-open");
    };

    document.getElementById("closeSidebar").onclick = () => {
      document
        .getElementById("sidebar")
        .classList.remove("mobile-open");
    };

    showLogin();

  </script>

<body>

  <!-- =========================
       LOGIN / REGISTER
  ========================== -->

  <section id="authScreen">

    <div class="auth-card">

      <div class="logo">
        💬
      </div>

      <h1 id="authTitle">
        Chào mừng trở lại
      </h1>

      <p class="auth-subtitle" id="authSubtitle">
        Đăng nhập vào HT Chat
      </p>

      <!-- LOGIN -->

      <form id="loginForm">

        <div class="input-group">
          <label>Email</label>
          <input
            id="loginEmail"
            type="email"
            placeholder="email@example.com"
            autocomplete="email"
          >
        </div>

        <div class="input-group">
          <label>Mật khẩu</label>
          <input
            id="loginPassword"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
          >
        </div>

        <div
          id="loginError"
          class="auth-error"
        ></div>

        <button
          class="primary-button"
          type="submit"
        >
          Đăng nhập
        </button>

        <div class="switch-auth">
          Chưa có tài khoản?
          <button
            type="button"
            id="showRegister"
          >
            Đăng ký
          </button>
        </div>

      </form>

      <!-- REGISTER -->

      <form
        id="registerForm"
        class="hidden"
      >

        <div class="input-group">
          <label>Tên người dùng</label>
          <input
            id="registerUsername"
            type="text"
            placeholder="Tên của bạn"
            maxlength="30"
          >
        </div>

        <div class="input-group">
          <label>Email</label>
          <input
            id="registerEmail"
            type="email"
            placeholder="email@example.com"
            autocomplete="email"
          >
        </div>

        <div class="input-group">
          <label>Mật khẩu</label>
          <input
            id="registerPassword"
            type="password"
            placeholder="Ít nhất 6 ký tự"
            autocomplete="new-password"
          >
        </div>

        <div
          id="registerError"
          class="auth-error"
        ></div>

        <button
          class="primary-button"
          type="submit"
        >
          Tạo tài khoản
        </button>

        <div class="switch-auth">
          Đã có tài khoản?
          <button
            type="button"
            id="showLogin"
          >
            Đăng nhập
          </button>
        </div>

      </form>

    </div>

  </section>


  <!-- =========================
       CHAT
  ========================== -->

  <section
    id="chatScreen"
    class="hidden"
  >

    <!-- SIDEBAR -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-header">

        <div class="brand">

          <div class="brand-icon">
            💬
          </div>

          <div>
            <div class="brand-text">
              HT Chat
            </div>

            <div class="brand-subtitle">
              Nhắn tin realtime
            </div>
          </div>

          <button
            id="closeSidebar"
            class="mobile-menu"
            style="margin-left:auto"
          >
            ×
          </button>

        </div>

        <div class="search-box">
          <input
            type="text"
            placeholder="🔍  Tìm người dùng..."
            id="searchInput"
          >
        </div>

      </div>

      <div
        class="user-list"
        id="userList"
      ></div>

      <div class="sidebar-bottom">

        <div class="my-account">

          <div
            class="avatar"
            id="currentUserAvatar"
          >
            ?
          </div>

          <div
            class="my-name"
            id="currentUserName"
          >
            Người dùng
          </div>

          <button
            class="logout"
            id="logoutButton"
            title="Đăng xuất"
          >
            ↪
          </button>

        </div>

      </div>

    </aside>


    <!-- MAIN CHAT -->

    <main class="main-chat">

      <header class="chat-header">

        <button
          class="mobile-menu"
          id="mobileMenu"
        >
          ☰
        </button>

        <div
          class="avatar"
          style="width:43px;height:43px"
        >
          👤
        </div>

        <div class="chat-header-info">

          <div
            class="chat-header-name"
            id="chatName"
          >
            Chưa chọn cuộc trò chuyện
          </div>

          <div
            class="chat-header-status"
            id="chatStatus"
          >
            --
          </div>

        </div>

      </header>


      <!-- EMPTY -->

      <div
        class="chat-empty"
        id="chatEmpty"
      >

        <div>

          <div class="chat-empty-icon">
            💬
          </div>

          <h2>
            Chọn một người để trò chuyện
          </h2>

          <p>
            Chọn người dùng ở bên trái để bắt đầu nhắn tin.
          </p>

        </div>

      </div>


      <!-- CHAT -->

      <div
        id="chatContent"
        class="hidden"
      >

        <div
          class="messages"
          id="messages"
        ></div>

        <div class="message-input-area">

          <div class="message-form">

            <input
              id="messageInput"
              type="text"
              placeholder="Nhập tin nhắn..."
              autocomplete="off"
            >

            <button
              class="send-button"
              id="sendButton"
            >
              ➤
            </button>

          </div>

        </div>

      </div>

    </main>

  </section>


  <script>
    // Tìm kiếm người dùng
    document
      .getElementById("searchInput")
      .addEventListener("input", function () {

        const keyword =
          this.value.toLowerCase().trim();

        document
          .querySelectorAll(".user-item")
          .forEach(item => {

            const name =
              item
                .querySelector(".user-name")
                ?.textContent
                .toLowerCase() || "";

            item.style.display =
              name.includes(keyword)
                ? "flex"
                : "none";
          });

      });
  </script>

</body>
</html>
