<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HT Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      height: 100vh;
      overflow: hidden;
    }

    button, input {
      font: inherit;
    }

    .app {
      display: flex;
      height: 100vh;
      background: white;
    }

    /* LOGIN */
    .login-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #eef1ff, #f8f9ff);
    }

    .login-box {
      width: 390px;
      max-width: calc(100% - 30px);
      padding: 35px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.12);
    }

    .login-logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #5865f2;
      margin-bottom: 10px;
    }

    .login-title {
      text-align: center;
      color: #555;
      margin-bottom: 25px;
    }

    .login-box input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
    }

    .login-box input:focus {
      border-color: #5865f2;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #5865f2;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .login-btn:hover {
      background: #4752c4;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #5865f2;
      cursor: pointer;
      font-size: 14px;
    }

    #loginError {
      color: #e53935;
      font-size: 13px;
      margin-bottom: 10px;
      text-align: center;
    }

    /* SIDEBAR */
    .sidebar {
      width: 330px;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .logo {
      padding: 24px;
      font-size: 26px;
      font-weight: bold;
      color: #5865f2;
    }

    .my-account {
      margin: 0 18px 15px;
      padding: 13px;
      background: #f5f6ff;
      border-radius: 14px;
    }

    .my-email {
      font-size: 13px;
      color: #555;
      word-break: break-all;
    }

    .logout {
      margin-top: 8px;
      border: none;
      background: transparent;
      color: #5865f2;
      cursor: pointer;
      padding: 0;
    }

    .search {
      margin: 0 18px 18px;
      padding: 13px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      outline: none;
      background: #f8fafc;
    }

    .chat {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px 20px;
      background: #eef0ff;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 18px;
      flex-shrink: 0;
    }

    .chat-name {
      font-weight: bold;
    }

    .last-message {
      color: #8b8f98;
      font-size: 13px;
      margin-top: 5px;
    }

    /* CHAT */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .header {
      height: 75px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      padding: 0 25px;
      gap: 13px;
    }

    .user-name {
      font-size: 17px;
      font-weight: bold;
    }

    .online {
      color: #22c55e;
      font-size: 13px;
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      background: #fafbff;
    }

    .message {
      display: flex;
      margin-bottom: 18px;
    }

    .message.me {
      justify-content: flex-end;
    }

    .bubble-wrap {
      max-width: 65%;
    }

    .sender {
      font-size: 12px;
      color: #777;
      margin-bottom: 4px;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
      word-break: break-word;
    }

    .message.me .bubble {
      background: #5865f2;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .message:not(.me) .bubble {
      border-bottom-left-radius: 5px;
    }

    .input-area {
      padding: 18px 22px;
      border-top: 1px solid #e5e7eb;
      background: white;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f5f7fb;
      border-radius: 16px;
      padding: 8px 10px;
    }

    .input-box input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      padding: 10px;
    }

    .send-btn {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 11px 16px;
      background: #5865f2;
      color: white;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 90px;
      }

      .logo {
        font-size: 18px;
        padding: 20px 5px;
        text-align: center;
      }

      .my-account,
      .search,
      .chat-name,
      .last-message {
        display: none;
      }

      .chat {
        justify-content: center;
        padding: 14px 8px;
      }

      .messages {
        padding: 18px 12px;
      }

      .bubble-wrap {
        max-width: 80%;
      }
    }
  </style>
</head>

<body>

  <!-- ĐĂNG NHẬP -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">

      <div class="login-logo">💬 HT Chat</div>

      <div class="login-title" id="loginTitle">
        Đăng nhập để bắt đầu trò chuyện
      </div>

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="Mật khẩu"
      >

      <div id="loginError"></div>

      <button class="login-btn" id="loginBtn">
        Đăng nhập
      </button>

      <div class="switch" id="switchMode">
        Chưa có tài khoản? Đăng ký
      </div>

    </div>
  </div>

  <!-- APP -->
  <div class="app">

    <aside class="sidebar">

      <div class="logo">
        💬 HT Chat
      </div>

      <div class="my-account">
        <div>👤 Tài khoản</div>
        <div class="my-email" id="myEmail"></div>
        <button class="logout" id="logoutBtn">
          Đăng xuất
        </button>
      </div>

      <input
        class="search"
        placeholder="🔍 Tìm kiếm..."
      >

      <div class="chat">
        <div class="avatar">🌍</div>

        <div>
          <div class="chat-name">Phòng trò chuyện chung</div>
          <div class="last-message">
            Trò chuyện cùng mọi người
          </div>
        </div>
      </div>

    </aside>

    <main class="main">

      <header class="header">

        <div class="avatar">🌍</div>

        <div>
          <div class="user-name">
            Phòng trò chuyện chung
          </div>

          <div class="online">
            ● Trực tuyến
          </div>
        </div>

      </header>

      <section
        class="messages"
        id="messages"
      ></section>

      <div class="input-area">

        <div class="input-box">

          <input
            id="messageInput"
            type="text"
            placeholder="Nhập tin nhắn..."
            autocomplete="off"
          >

          <button
            class="send-btn"
            id="sendBtn"
          >
            ➤
          </button>

        </div>

      </div>

    </main>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCl_jtHMpBrxVsYPMRLXCVL5rNXaTIE8Hs",
      authDomain: "ht-chat-e001c.firebaseapp.com",
      projectId: "ht-chat-e001c",
      storageBucket: "ht-chat-e001c.firebasestorage.app",
      messagingSenderId: "895784141081",
      appId: "1:895784141081:web:ef5330c81b3ec0f8c48588",
      measurementId: "G-BK83DWBJ7M"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    let registerMode = false;


    const loginScreen =
      document.getElementById("loginScreen");

    const loginBtn =
      document.getElementById("loginBtn");

    const switchMode =
      document.getElementById("switchMode");

    const loginTitle =
      document.getElementById("loginTitle");

    const loginError =
      document.getElementById("loginError");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const myEmail =
      document.getElementById("myEmail");

    const messageInput =
      document.getElementById("messageInput");

    const sendBtn =
      document.getElementById("sendBtn");

    const messages =
      document.getElementById("messages");


    /* ĐĂNG NHẬP / ĐĂNG KÝ */

    switchMode.onclick = () => {

      registerMode = !registerMode;

      loginError.textContent = "";

      if (registerMode) {

        loginTitle.textContent =
          "Tạo tài khoản HT Chat";

        loginBtn.textContent =
          "Đăng ký";

        switchMode.textContent =
          "Đã có tài khoản? Đăng nhập";

      } else {

        loginTitle.textContent =
          "Đăng nhập để bắt đầu trò chuyện";

        loginBtn.textContent =
          "Đăng nhập";

        switchMode.textContent =
          "Chưa có tài khoản? Đăng ký";
      }

    };


    loginBtn.onclick = async () => {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      loginError.textContent = "";

      if (!email || !password) {

        loginError.textContent =
          "Vui lòng nhập email và mật khẩu.";

        return;
      }

      try {

        if (registerMode) {

          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

        } else {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        }

      } catch (error) {

        console.error(error);

        loginError.textContent =
          "Email hoặc mật khẩu không hợp lệ.";

      }

    };


    /* ĐĂNG XUẤT */

    logoutBtn.onclick = async () => {

      await signOut(auth);

    };


    /* THEO DÕI ĐĂNG NHẬP */

    onAuthStateChanged(auth, user => {

      if (user) {

        loginScreen.style.display = "none";

        myEmail.textContent =
          user.email;

        loadMessages();

      } else {

        loginScreen.style.display = "flex";

        messages.innerHTML = "";

      }

    });


    /* GỬI TIN NHẮN */

    async function sendMessage() {

      const text =
        messageInput.value.trim();

      if (!text || !auth.currentUser) {
        return;
      }

      try {

        await addDoc(
          collection(db, "messages"),
          {
            text: text,
            email: auth.currentUser.email,
            uid: auth.currentUser.uid,
            createdAt: serverTimestamp()
          }
        );

        messageInput.value = "";

      } catch (error) {

        console.error(error);

        alert("Không gửi được tin nhắn.");

      }

    }


    sendBtn.onclick = sendMessage;


    messageInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          sendMessage();

        }

      }
    );


    /* NHẬN TIN NHẮN REALTIME */

    function loadMessages() {

      const q = query(
        collection(db, "messages"),
        orderBy("createdAt", "asc")
      );

      onSnapshot(q, snapshot => {

        messages.innerHTML = "";

        snapshot.forEach(doc => {

          const data = doc.data();

          const isMe =
            auth.currentUser &&
            data.uid === auth.currentUser.uid;

          const message =
            document.createElement("div");

          message.className =
            "message " + (isMe ? "me" : "");

          const wrap =
            document.createElement("div");

          wrap.className =
            "bubble-wrap";

          if (!isMe) {

            const sender =
              document.createElement("div");

            sender.className =
              "sender";

            sender.textContent =
              data.email || "Người dùng";

            wrap.appendChild(sender);

          }

          const bubble =
            document.createElement("div");

          bubble.className =
            "bubble";

          bubble.textContent =
            data.text || "";

          wrap.appendChild(bubble);

          message.appendChild(wrap);

          messages.appendChild(message);

        });

        messages.scrollTop =
          messages.scrollHeight;

      });

    }

  </script>

</body>
</html>
