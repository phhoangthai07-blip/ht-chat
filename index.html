<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HT Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      max-width: 1500px;
      margin: auto;
      background: white;
    }

    /* SIDEBAR */
    .sidebar {
      width: 330px;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .logo {
      padding: 24px;
      font-size: 26px;
      font-weight: bold;
      color: #5865f2;
    }

    .search {
      margin: 0 18px 18px;
      padding: 13px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      outline: none;
      font-size: 15px;
      background: #f8fafc;
    }

    .chat-list {
      overflow-y: auto;
    }

    .chat {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px 20px;
      cursor: pointer;
    }

    .chat:hover {
      background: #f5f6ff;
    }

    .chat.active {
      background: #eef0ff;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 18px;
      flex-shrink: 0;
    }

    .chat-info {
      min-width: 0;
      flex: 1;
    }

    .chat-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .last-message {
      color: #8b8f98;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* MAIN CHAT */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .header {
      height: 75px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      padding: 0 25px;
      gap: 13px;
    }

    .user-name {
      font-size: 17px;
      font-weight: bold;
    }

    .online {
      color: #22c55e;
      font-size: 13px;
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      background: #fafbff;
    }

    .message {
      display: flex;
      margin-bottom: 18px;
    }

    .message.me {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 65%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .message.me .bubble {
      background: #5865f2;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .message:not(.me) .bubble {
      border-bottom-left-radius: 5px;
    }

    /* INPUT */
    .input-area {
      padding: 18px 22px;
      border-top: 1px solid #e5e7eb;
      background: white;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f5f7fb;
      border-radius: 16px;
      padding: 8px 10px;
    }

    .input-box input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      padding: 10px;
      font-size: 15px;
    }

    .icon-btn,
    .send-btn {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 10px 13px;
      font-size: 18px;
    }

    .icon-btn {
      background: transparent;
    }

    .send-btn {
      background: #5865f2;
      color: white;
    }

    .send-btn:hover {
      background: #4752c4;
    }

    /* MOBILE */
    @media (max-width: 700px) {
      .sidebar {
        width: 90px;
      }

      .logo {
        font-size: 20px;
        padding: 20px 10px;
        text-align: center;
      }

      .search {
        display: none;
      }

      .chat {
        justify-content: center;
        padding: 14px 8px;
      }

      .chat-info {
        display: none;
      }

      .header {
        padding: 0 15px;
      }

      .messages {
        padding: 20px 12px;
      }

      .bubble {
        max-width: 80%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- DANH SÁCH CHAT -->
  <aside class="sidebar">

    <div class="logo">
      💬 HT Chat
    </div>

    <input
      class="search"
      type="text"
      placeholder="🔍 Tìm kiếm..."
    >

    <div class="chat-list">

      <div class="chat active">
        <div class="avatar">A</div>

        <div class="chat-info">
          <div class="chat-name">Anh Tuấn</div>
          <div class="last-message">Chào bạn 👋</div>
        </div>
      </div>

      <div class="chat">
        <div class="avatar">M</div>

        <div class="chat-info">
          <div class="chat-name">Minh</div>
          <div class="last-message">Tối nay chơi không?</div>
        </div>
      </div>

      <div class="chat">
        <div class="avatar">H</div>

        <div class="chat-info">
          <div class="chat-name">Hoàng</div>
          <div class="last-message">Ok 👍</div>
        </div>
      </div>

    </div>
  </aside>

  <!-- KHUNG CHAT -->
  <main class="main">

    <header class="header">

      <div class="avatar">A</div>

      <div>
        <div class="user-name">Anh Tuấn</div>
        <div class="online">● Đang hoạt động</div>
      </div>

    </header>

    <section class="messages" id="messages">

      <div class="message">
        <div class="bubble">
          Chào bạn 👋
        </div>
      </div>

      <div class="message me">
        <div class="bubble">
          Chào! Rất vui được nói chuyện với bạn 😄
        </div>
      </div>

      <div class="message">
        <div class="bubble">
          Đây sẽ là ứng dụng HT Chat của chúng ta!
        </div>
      </div>

    </section>

    <div class="input-area">

      <div class="input-box">

        <button class="icon-btn">😊</button>

        <input
          id="messageInput"
          type="text"
          placeholder="Nhập tin nhắn..."
          autocomplete="off"
        >

        <button class="icon-btn">📎</button>

        <button
          class="send-btn"
          onclick="sendMessage()"
        >
          ➤
        </button>

      </div>

    </div>

  </main>

</div>

<script>
  function sendMessage() {

    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    const text = input.value.trim();

    if (!text) return;

    const message = document.createElement("div");

    message.className = "message me";

    message.innerHTML = `
      <div class="bubble">
        ${text}
      </div>
    `;

    messages.appendChild(message);

    input.value = "";

    messages.scrollTop = messages.scrollHeight;
  }

  document
    .getElementById("messageInput")
    .addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    });
</script>

</body>
</html>
